<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>BunDeal – Offers</title>
  <meta name="description" content="BunDeal shows offers with cashback, a referral, or a creator campaign.">
  <link rel="icon" href="assets/logo-icon.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css?v=26">
</head>
<body data-page="deals">
  <a class="skip" href="#inhalt">Skip to content</a>
  <div class="proto" data-i18n="proto">Purchase is not possible yet. The offers are examples, and no payout is enabled.</div>
  <header class="site-header">
    <div class="wrap header-inner">
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu"><span class="burger-lines" aria-hidden="true"></span><span class="visually-hidden">Menu</span></button>
      <a class="brand" href="index-en.html"><img src="assets/logo.svg?v=4" alt="BunDeal, Save more together."></a>
      <form class="header-search" role="search">
        <input type="search" data-deal-search placeholder="Search deals" aria-label="Search">
      </form>
      <div class="header-actions">
        <div class="account-slot" data-account-slot>
          <a class="account-menu-button" href="login.html?lang=en">Sign in/Register</a>
        </div>
        <a class="create-button" href="submit-deal.html?lang=en">+ Create</a>
      </div>
    </div>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <a href="index-en.html" aria-current="page">Deals</a>
      <a href="about-en.html">What is BunDeal</a>
      <a href="privacy-en.html">Privacy</a>
      <a href="legal-notice-en.html">Legal notice</a>
      <a class="language-switch" href="index.html" lang="de">DE</a>
    </nav>
  </header>
  <div class="market-shelf">
    <div class="wrap shelf-inner">
      <div class="shelf-filters" data-deal-filters>
        <label class="category-filter">
          <span class="category-icon" aria-hidden="true"></span>
          Categories
          <select data-category-filter>
            <option value="">All</option>
          </select>
        </label>
        <label>Type
          <select data-mode-filter>
            <option value="">All</option>
            <option value="listing">Deal</option>
            <option value="cashback">Cashback</option>
            <option value="referral">Referral</option>
            <option value="creator">Creator</option>
          </select>
        </label>
        <label>Merchant <select data-merchant-filter><option value="">All</option></select></label>
      </div>
      <aside class="offer-legend" aria-label="Offer types">
        <span class="offer-pill is-listing" title="Shop price only. No cashback.">Deal</span>
        <span class="offer-pill is-cashback" title="Buyer only, from confirmed commission.">Cashback</span>
        <span class="offer-pill is-referral" title="Buyer and one direct referrer.">Referral</span>
        <span class="offer-pill is-creator" title="Plus an approved campaign.">Creator</span>
      </aside>
    </div>
  </div>
  <main id="inhalt">
    <section>
      <div class="wrap">
        <h1 class="visually-hidden">Offers</h1>
        <div class="deal-grid" data-deal-list></div>
        <p class="status" data-deal-status role="status"></p>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <strong>BunDeal</strong>
        <p>Save more together.</p>
      </div>
      <nav aria-label="Footer">
        <a href="about-en.html">What is BunDeal</a>
        <a href="legal-notice-en.html">Legal notice</a>
        <a href="privacy-en.html">Privacy</a>
      </nav>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/deals.js?v=14"></script>
  <script src="js/account-menu.js?v=3"></script>
  <script src="js/site.js"></script>
</body>
</html>
